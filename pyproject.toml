[project]
name = "amanuensis"
version = "0.1.0"
description = "Personal real-time multilingual speech-to-text that adapts to one speaker"
authors = [
    { name = "Veerbhadra", email = "mahantveerbhadra596@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "jiwer>=4.0.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "peft>=0.21.2",
    "torch>=2.11.0",
    "transformers>=5.18.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
